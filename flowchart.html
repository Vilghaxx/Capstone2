<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dental System — Flowchart</title>
<style>
  :root{
    --cobalt:#0B389D; --lightcobalt:#2F57AB; --azure:#0284C7; --sky:#38BDF8;
    --light:#E0F2FE; --mid:#BAE6FD; --ink:#123C7D;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:Inter,"Segoe UI",system-ui,sans-serif;
    background:linear-gradient(180deg,#EFF6FF 0%,#FFFFFF 55%);
    color:var(--ink); padding:28px 24px 60px;
  }
  header{
    max-width:1500px;margin:0 auto 8px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
  }
  h1{
    font-size:26px;font-weight:800;letter-spacing:-0.5px;
    background:linear-gradient(90deg,var(--cobalt) 0%,var(--azure) 55%,var(--sky) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1 small{font-size:14px;font-weight:600;color:#64748B;-webkit-text-fill-color:#64748B}
  .legend{display:flex;flex-wrap:wrap;gap:8px}
  .pill{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);
    background:#fff;border:1px solid var(--mid);border-radius:999px;padding:5px 12px;
    box-shadow:0 1px 3px rgba(2,132,199,.12);
  }
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.grad{background:linear-gradient(135deg,var(--azure),var(--sky))}
  .note{
    max-width:1500px;margin:0 auto 6px;font-size:12.5px;color:#64748B;
  }
  .note b{color:var(--azure)}
  .wrap{max-width:1500px;margin:0 auto;background:#fff;border:1px solid var(--mid);
    border-radius:18px;box-shadow:0 10px 34px rgba(11,56,157,.10);padding:14px}
</style>
</head>
<body>

<header>
  <h1>Dental System <small>— end-to-end flow</small></h1>
  <div class="legend">
    <span class="pill"><span class="dot" style="background:var(--cobalt)"></span>Dentist</span>
    <span class="pill"><span class="dot" style="background:var(--azure)"></span>Cashier</span>
    <span class="pill"><span class="dot" style="background:var(--sky)"></span>Patient</span>
    <span class="pill"><span class="dot grad"></span>System / Database</span>
    <span class="pill"><span class="dot" style="background:var(--light);border:1.5px solid var(--azure)"></span>Decision</span>
  </div>
</header>

<p class="note">Gradient: <b>Azure Clinic</b> <code>#E0F2FE → #0284C7</code> (gecdesigns.com) · deep accents <b>Cobalt</b> <code>#0B389D → #2F57AB</code> (schemecolor.com blue–white gradient). Sources: server/routes/*.js, src/app/page.tsx, README.md</p>
