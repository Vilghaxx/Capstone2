# render.yaml - Infrastructure as Code for Render deployment
# Usage: render deploy (requires Render CLI) or use as reference for manual setup

services:
  - type: web
    name: dental-system
    env: node
    region: oregon # or frankfurt, singapore, etc.
    plan: starter # or standard, pro based on needs
    buildCommand: npm install && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: bash start.sh
    healthCheckPath: /api
    envVars:
      - key: FIREBASE_KEY_PATH
        value: sonidodentalsystem-firebase-adminsdk-fbsvc-5784825144.json
      - key: FIREBASE_DATABASE_URL
        value: https://sonidodentalsystem-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: 933171086472-ajmje2ohi7tieracdqa3l6muk9mpkblf.apps.googleusercontent.com # full client ID; audience must match the ID token
      - key: NEXT_PUBLIC_API_URL
        value: https://dental-system-go24.onrender.com # update with your service URL
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096

